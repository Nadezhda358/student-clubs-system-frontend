<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.w3.org/1999/xhtml">
  <body>
    <th:block th:fragment="pageContent">
      <div class="event-form-layout">
        <section class="event-form-hero">
          <div>
            <h1 th:text="${pageTitle}">Създай събитие</h1>
            <p class="event-form-hero__subtitle" th:text="${pageSubtitle}">
              Настройте времето, капацитета и видимостта на събитието.
            </p>
          </div>
        </section>

        <div class="admin-alert admin-alert--success" th:if="${successMessage}" th:text="${successMessage}"></div>

        <form
          class="event-form-surface"
          method="post"
          enctype="multipart/form-data"
          th:action="${formAction}"
          th:object="${form}"
        >
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

          <div class="event-form__grid">
            <div class="event-form__field event-form__field--wide">
              <label for="clubId">Клуб</label>
              <select id="clubId" class="event-form__select" th:field="*{clubId}">
                <option value="">Изберете клуб</option>
                <option
                  th:each="club : ${clubOptions}"
                  th:value="${club.id}"
                  th:text="${club.name}"
                ></option>
              </select>
            </div>

            <div class="event-form__field event-form__field--wide">
              <label for="title">Заглавие</label>
              <input id="title" class="event-form__input" type="text" maxlength="200" th:field="*{title}" />
            </div>

            <div class="event-form__field event-form__field--wide">
              <label for="description">Описание</label>
              <textarea
                id="description"
                class="event-form__textarea"
                maxlength="5000"
                th:field="*{description}"
              ></textarea>
              <p class="event-form__hint">Нека описанието е ясно и конкретно, за да знаят учениците какво да очакват.</p>
            </div>

            <div class="event-form__field">
              <label for="startAt">Начало</label>
              <input id="startAt" class="event-form__input" type="datetime-local" th:field="*{startAt}" />
            </div>

            <div class="event-form__field">
              <label for="endAt">Край</label>
              <input id="endAt" class="event-form__input" type="datetime-local" th:field="*{endAt}" />
            </div>

            <div class="event-form__field">
              <label for="registrationDeadline">Краен срок за записване</label>
              <input
                id="registrationDeadline"
                class="event-form__input"
                type="datetime-local"
                th:field="*{registrationDeadline}"
              />
            </div>

            <div class="event-form__field">
              <label for="capacity">Капацитет</label>
              <input id="capacity" class="event-form__input" type="number" min="1" th:field="*{capacity}" />
            </div>

            <div class="event-form__field">
              <label for="status">Статус</label>
              <select id="status" class="event-form__select" th:field="*{status}">
                <option value="">Изберете статус</option>
                <option
                  th:each="status : ${statusValues}"
                  th:value="${status.name()}"
                  th:text="${T(com.school.ppmg.student_clubs_system_client.controllers.support.EventViewSupport).formatLabel(status)}"
                ></option>
              </select>
            </div>

            <div class="event-form__field">
              <label for="audience">Видимост</label>
              <select id="audience" class="event-form__select" th:field="*{audience}">
                <option value="">Изберете видимост</option>
                <option
                  th:each="audience : ${audienceValues}"
                  th:value="${audience.name()}"
                  th:text="${T(com.school.ppmg.student_clubs_system_client.controllers.support.EventViewSupport).formatLabel(audience)}"
                ></option>
              </select>
            </div>

            <div class="event-form__field event-form__field--wide">
              <label for="location">Място</label>
              <input id="location" class="event-form__input" type="text" maxlength="200" th:field="*{location}" />
            </div>

            <div class="event-form__field event-form__field--wide">
              <label for="mainImage">Основно изображение</label>
              <div class="event-form__media">
                <div
                  class="event-form__image-preview"
                  th:if="${eventMainImageUrl != null and !#strings.isEmpty(eventMainImageUrl)}"
                >
                  <img th:src="${eventMainImageUrl}" alt="Текущо изображение на събитието" />
                </div>
                <div
                  class="event-form__image-placeholder"
                  th:unless="${eventMainImageUrl != null and !#strings.isEmpty(eventMainImageUrl)}"
                >
                  Все още няма качено изображение.
                </div>

                <input
                  id="mainImage"
                  class="event-form__input event-form__input--file"
                  type="file"
                  accept="image/*"
                  th:field="*{mainImage}"
                />

                <p class="event-form__hint">
                  Качете едно изображение до 5 MB. При редакция изборът на нов файл ще замени текущото изображение.
                </p>
              </div>
            </div>
          </div>

          <div
            class="admin-alert admin-alert--error event-form__submit-error"
            th:if="${errorMessage}"
            th:text="${errorMessage}"
            role="alert"
            aria-live="polite"
          ></div>

          <div class="event-form__actions">
            <button class="events-button events-button--primary" type="submit" th:text="${submitLabel}">Запази</button>
            <a class="events-link events-link--ghost" th:href="${cancelHref}">Отказ</a>
          </div>
        </form>
      </div>
    </th:block>
  </body>
</html>
