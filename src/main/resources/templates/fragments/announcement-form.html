<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.w3.org/1999/xhtml">
  <body>
    <th:block th:fragment="pageContent">
      <div class="event-form-layout">
        <section class="event-form-hero">
          <div>
            <h1 th:text="${pageTitle}">Създай съобщение</h1>
            <p class="event-form-hero__subtitle" th:text="${pageSubtitle}">
              Споделете обновление с клубната общност.
            </p>
          </div>
        </section>

        <div class="admin-alert admin-alert--success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="admin-alert admin-alert--error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form class="event-form-surface" method="post" th:action="${formAction}" th:object="${form}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

          <div class="event-form__grid">
            <div class="event-form__field event-form__field--wide">
              <label for="clubId">Клуб</label>
              <select id="clubId" class="event-form__select" th:field="*{clubId}">
                <option value="">Изберете клуб</option>
                <option
                  th:each="club : ${clubOptions}"
                  th:value="${club.id}"
                  th:text="${club.name}"
                ></option>
              </select>
            </div>

            <div class="event-form__field event-form__field--wide">
              <label for="title">Заглавие</label>
              <input id="title" class="event-form__input" type="text" maxlength="200" th:field="*{title}" />
            </div>

            <div class="event-form__field event-form__field--wide">
              <label for="body">Текст</label>
              <textarea
                id="body"
                class="event-form__textarea"
                maxlength="8000"
                th:field="*{body}"
              ></textarea>
              <p class="event-form__hint">Напишете съобщението точно както трябва да го видят учениците. Максимум 8000 знака.</p>
            </div>

            <div class="event-form__field">
              <label for="published">Видимост</label>
              <select id="published" class="event-form__select" th:field="*{published}">
                <option th:value="false">Чернова</option>
                <option th:value="true">Публикувано</option>
              </select>
            </div>
          </div>

          <div class="event-form__actions" style="margin-top: 1.1rem;">
            <button class="events-button events-button--primary" type="submit" th:text="${submitLabel}">Запази</button>
            <a class="events-link events-link--ghost" th:href="${cancelHref}">Отказ</a>
          </div>
        </form>
      </div>
    </th:block>
  </body>
</html>
