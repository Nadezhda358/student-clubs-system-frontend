<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.w3.org/1999/xhtml">
  <body th:fragment="adminShell(pageBodyClass, content, pageScripts)" th:classappend="${pageBodyClass}">
    <header th:replace="fragments/site-chrome :: siteHeader"></header>

    <main class="admin-shell">
      <div class="admin-shell__container">
        <div class="admin-shell__grid">
          <aside class="admin-sidebar" aria-label="Административна навигация">
            <details
              class="admin-sidebar__details"
              open
              th:with="
                path=${currentPath != null ? currentPath : ''},
                clubsActive=${path == '/admin/clubs' or #strings.startsWith(path, '/admin/clubs/')},
                eventsActive=${path == '/admin/events' or path == '/admin/events/create' or #strings.startsWith(path, '/admin/events/')},
                announcementsActive=${path == '/admin/announcements' or path == '/admin/announcements/create' or #strings.startsWith(path, '/admin/announcements/')},
                clubAppsActive=${path == '/admin/applications/clubs' or path == '/admin/membership-applications'},
                eventAppsActive=${path == '/admin/applications/events' or path == '/admin/event-participations' or path == '/admin/event-applications'},
                reportsActive=${path == '/admin/stats' or path == '/admin/reports'},
                teacherInvitesActive=${path == '/admin/teacher-invites' or path == '/admin/teacher-invites/new'}
              "
            >
              <summary class="admin-sidebar__toggle">Администраторско меню</summary>

              <div class="admin-sidebar__panel">
                <div class="admin-sidebar__heading">
                  <h2>Управлявай</h2>
                </div>

                <nav class="admin-sidebar__nav">
                  <a
                    class="admin-sidebar__link"
                    th:classappend="${clubsActive} ? ' is-active' : ''"
                    th:attr="aria-current=${clubsActive} ? 'page' : null"
                    th:href="@{/admin/clubs}"
                  >
                    Клубове
                  </a>
                  <a
                    class="admin-sidebar__link"
                    th:classappend="${eventsActive} ? ' is-active' : ''"
                    th:attr="aria-current=${eventsActive} ? 'page' : null"
                    th:href="@{/admin/events}"
                  >
                    Събития
                  </a>
                  <a
                    class="admin-sidebar__link"
                    th:classappend="${announcementsActive} ? ' is-active' : ''"
                    th:attr="aria-current=${announcementsActive} ? 'page' : null"
                    th:href="@{/admin/announcements}"
                  >
                    Съобщения
                  </a>
                  <a
                    class="admin-sidebar__link"
                    th:classappend="${clubAppsActive} ? ' is-active' : ''"
                    th:attr="aria-current=${clubAppsActive} ? 'page' : null"
                    th:href="@{/admin/applications/clubs}"
                  >
                    Кандидатури за членство в клубове
                  </a>
                  <a
                    class="admin-sidebar__link"
                    th:classappend="${eventAppsActive} ? ' is-active' : ''"
                    th:attr="aria-current=${eventAppsActive} ? 'page' : null"
                    th:href="@{/admin/event-participations}"
                  >
                    Регистрации за събития
                  </a>
                  <a
                    class="admin-sidebar__link"
                    th:classappend="${reportsActive} ? ' is-active' : ''"
                    th:attr="aria-current=${reportsActive} ? 'page' : null"
                    th:href="@{/admin/reports}"
                  >
                    Справки
                  </a>
                  <a
                    class="admin-sidebar__link"
                    th:classappend="${teacherInvitesActive} ? ' is-active' : ''"
                    th:attr="aria-current=${teacherInvitesActive} ? 'page' : null"
                    th:href="@{/admin/teacher-invites}"
                  >
                    Покани учител
                  </a>
                </nav>
              </div>
            </details>
          </aside>

          <section class="admin-shell__content">
            <th:block th:replace="${content}"></th:block>
          </section>
        </div>
      </div>
    </main>

    <footer th:replace="fragments/site-chrome :: siteFooter"></footer>
    <th:block th:if="${pageScripts != null}" th:replace="${pageScripts}"></th:block>
  </body>
</html>
