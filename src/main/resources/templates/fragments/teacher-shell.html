<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.w3.org/1999/xhtml">
  <body th:fragment="teacherShell(pageBodyClass, content, pageScripts)" th:classappend="${pageBodyClass}">
    <header th:replace="fragments/site-chrome :: siteHeader"></header>

    <main class="admin-shell">
      <div class="admin-shell__container">
        <div class="admin-shell__grid">
          <aside class="admin-sidebar" aria-label="Навигация за учители">
            <details
              class="admin-sidebar__details"
              open
              th:with="
                path=${currentPath != null ? currentPath : ''},
                clubsActive=${path == '/teacher' or path == '/teacher/clubs' or #strings.startsWith(path, '/teacher/clubs/')},
                eventsActive=${path == '/teacher/events' or path == '/teacher/events/create' or #strings.startsWith(path, '/teacher/events/')},
                announcementsActive=${path == '/teacher/announcements' or path == '/teacher/announcements/create' or #strings.startsWith(path, '/teacher/announcements/')},
                eventAppsActive=${path == '/teacher/event-participations'},
                clubAppsActive=${path == '/teacher/membership-applications'}
              "
            >
              <summary class="admin-sidebar__toggle">Учителско меню</summary>

              <div class="admin-sidebar__panel">
                <div class="admin-sidebar__heading">
                  <h2>Управлявай</h2>
                </div>

                <nav class="admin-sidebar__nav">
                  <a
                    class="admin-sidebar__link"
                    th:classappend="${clubsActive} ? ' is-active' : ''"
                    th:attr="aria-current=${clubsActive} ? 'page' : null"
                    th:href="@{/teacher/clubs}"
                  >
                    Моите клубове
                  </a>
                  <a
                    class="admin-sidebar__link"
                    th:classappend="${eventsActive} ? ' is-active' : ''"
                    th:attr="aria-current=${eventsActive} ? 'page' : null"
                    th:href="@{/teacher/events}"
                  >
                    Събития
                  </a>
                  <a
                    class="admin-sidebar__link"
                    th:classappend="${announcementsActive} ? ' is-active' : ''"
                    th:attr="aria-current=${announcementsActive} ? 'page' : null"
                    th:href="@{/teacher/announcements}"
                  >
                    Съобщения
                  </a>
                  <a
                    class="admin-sidebar__link"
                    th:classappend="${clubAppsActive} ? ' is-active' : ''"
                    th:attr="aria-current=${clubAppsActive} ? 'page' : null"
                    th:href="@{/teacher/membership-applications}"
                  >
                    Кандидатури за членство в клубове
                  </a>
                  <a
                    class="admin-sidebar__link"
                    th:classappend="${eventAppsActive} ? ' is-active' : ''"
                    th:attr="aria-current=${eventAppsActive} ? 'page' : null"
                    th:href="@{/teacher/event-participations}"
                  >
                    Регистрации за събития
                  </a>
                </nav>
              </div>
            </details>
          </aside>

          <section class="admin-shell__content">
            <th:block th:replace="${content}"></th:block>
          </section>
        </div>
      </div>
    </main>

    <th:block th:replace="fragments/delete-confirmation :: deleteConfirmationModal"></th:block>
    <footer th:replace="fragments/site-chrome :: siteFooter"></footer>
    <script th:src="@{/js/delete-confirmation.js}" defer></script>
    <th:block th:if="${pageScripts != null}" th:replace="${pageScripts}"></th:block>
  </body>
</html>
