<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.w3.org/1999/xhtml">
  <body>
    <th:block th:fragment="deleteConfirmationModal">
      <div id="deleteConfirmModal" class="delete-modal" hidden aria-hidden="true">
        <div class="delete-modal__backdrop" data-delete-modal-close aria-hidden="true"></div>
        <div
          class="delete-modal__content"
          role="dialog"
          aria-modal="true"
          aria-labelledby="deleteConfirmTitle"
          aria-describedby="deleteConfirmMessage"
          tabindex="-1"
        >
          <div class="delete-modal__header">
            <div>
              <p class="delete-modal__eyebrow">Потвърждение</p>
              <h3 id="deleteConfirmTitle" class="delete-modal__title">Потвърди действието</h3>
            </div>
            <button
              class="delete-modal__close"
              type="button"
              data-delete-modal-close
              aria-label="Затвори потвърждението"
            >
              X
            </button>
          </div>

          <div class="delete-modal__body">
            <p id="deleteConfirmMessage" class="delete-modal__message">
              Сигурни ли сте, че искате да изтриете този елемент?
            </p>
            <div class="delete-modal__actions">
              <button id="deleteConfirmCancel" class="modal-btn modal-btn--secondary" type="button">Отказ</button>
              <button id="deleteConfirmConfirm" class="modal-btn modal-btn--danger" type="button">Изтрий</button>
            </div>
          </div>
        </div>
      </div>
    </th:block>
  </body>
</html>
