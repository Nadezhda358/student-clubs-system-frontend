<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Покани учители | ClubsHub Администрация</title>
    <link th:href="@{/assets/logo.png}" rel="icon" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Sora:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/site-chrome.css}" />
    <link rel="stylesheet" th:href="@{/css/design-tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/admin-shell.css}" />
    <link rel="stylesheet" th:href="@{/css/admin-invites.css}" />
    <link rel="stylesheet" th:href="@{/css/site-ui.css}" />
  </head>
  <body th:replace="~{fragments/admin-shell :: adminShell('admin-invites', ~{::adminPageContent}, ~{::pageScripts})}">
    <th:block th:fragment="adminPageContent">
      <div class="invite-page">
        <div class="invite-shell">
            <section class="invite-panel">
              <div class="invite-panel__header">
                <h1>Покани учители</h1>
                <p>
                  Изпратете няколко покани към учители с една заявка.
                </p>
              </div>

              <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
              <div class="alert alert-warning" th:if="${warning}" th:text="${warning}"></div>
              <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

              <form th:action="@{/admin/teacher-invites}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <label class="form-label" for="emailsText">Имейли на учители</label>
                <textarea
                  class="form-control"
                  id="emailsText"
                  name="emailsText"
                  rows="6"
                  placeholder="teacher1@school.bg&#10;teacher2@school.bg"
                  th:text="${emailsText}"
                ></textarea>
                <div class="form-text">
                  Поставете по един имейл на ред (запетаи и точки и запетаи също се приемат).
                </div>

                <button class="btn-primary invite-submit" type="submit">Изпрати покани</button>
              </form>
            </section>

            <section
              class="invite-panel invite-panel--table"
              th:if="${invites != null and !#lists.isEmpty(invites)}"
            >
              <div class="invite-panel__header">
                <strong>Изпратени покани</strong>
              </div>
              <div class="invite-panel__table">
                <table class="invite-table">
                  <thead>
                    <tr>
                      <th scope="col">Имейл</th>
                      <th scope="col">Валидна до</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:each="invite : ${invites}">
                      <td th:text="${invite.email}">teacher@school.bg</td>
                      <td th:text="${invite.expiresAt}">2026-02-06T10:30:00Z</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>
          </div>
      </div>
    </th:block>

    <th:block th:fragment="pageScripts">
    </th:block>
  </body>
</html>
