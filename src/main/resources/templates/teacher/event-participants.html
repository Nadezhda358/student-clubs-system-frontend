<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Участници в събитието | ClubsHub Учител</title>
    <link th:href="@{/assets/logo.png}" rel="icon" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Sora:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/site-chrome.css}" />
    <link rel="stylesheet" th:href="@{/css/design-tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/admin-shell.css}" />
    <link rel="stylesheet" th:href="@{/css/admin-clubs.css}" />
    <link rel="stylesheet" th:href="@{/css/events.css}" />
    <link rel="stylesheet" th:href="@{/css/manage-events.css}" />
    <link rel="stylesheet" th:href="@{/css/site-ui.css}" />
  </head>
  <body th:replace="~{fragments/teacher-shell :: teacherShell('event-participants-page', ~{::teacherPageContent}, ~{::pageScripts})}">
    <th:block th:fragment="teacherPageContent">
      <div class="event-participants-page">
        <div class="container">
          <div class="event-participants">
            <section class="event-participants__hero">
              <div>
                <h1>Участници в събитието</h1>
                <p class="event-participants__subtitle">Преглеждайте регистрациите за това събитие.</p>
              </div>
              <a class="events-link events-link--ghost" th:href="@{/teacher/events}">Назад към събитията</a>
            </section>

            <section class="event-participants__event-panel">
              <h2 th:text="${event.title}">Заглавие на събитието</h2>
              <p th:text="${event.clubName + ' - ' + (event.startAt != null ? T(com.school.ppmg.student_clubs_system_client.controllers.support.EventViewSupport).formatDateTime(event.startAt) : 'Графикът предстои')}">
                Клуб - график
              </p>
            </section>

            <div class="admin-alert admin-alert--success" th:if="${successMessage}" th:text="${successMessage}"></div>
            <div class="admin-alert admin-alert--error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

            <form method="get" th:action="@{/teacher/events/{id}/participants(id=${event.id})}" class="event-participants__filters">
              <div class="event-participants__filters-grid">
                <div class="event-participants__field">
                  <label for="teacherParticipantStatus">Статус</label>
                  <select id="teacherParticipantStatus" class="event-participants__select" name="status">
                    <option value="">Всички статуси</option>
                    <option
                      th:each="statusValue : ${statusValues}"
                      th:value="${statusValue.name()}"
                      th:selected="${selectedStatus != null and selectedStatus == statusValue}"
                      th:text="${T(com.school.ppmg.student_clubs_system_client.controllers.support.EventViewSupport).formatLabel(statusValue)}"
                    ></option>
                  </select>
                </div>

                <div class="event-participants__field event-participants__field--wide">
                  <label for="teacherParticipantSearch">Търсене</label>
                  <input id="teacherParticipantSearch" class="event-participants__input" type="text" name="q" th:value="${q}" placeholder="Търсене по име или имейл" />
                </div>
              </div>

              <div class="event-participants__filter-actions" style="margin-top: 0.9rem;">
                <button class="events-button events-button--primary" type="submit">Приложи филтрите</button>
                <a class="events-link events-link--ghost" th:href="@{/teacher/events/{id}/participants(id=${event.id})}">Изчисти</a>
              </div>
            </form>

            <div class="manage-events__empty" th:if="${#lists.isEmpty(participants)}">
              Няма участници по текущите филтри.
            </div>

            <div class="event-participants__table-wrap" th:if="${!#lists.isEmpty(participants)}">
              <table class="event-participants__table">
                <thead>
                  <tr>
                    <th>Ученик</th>
                    <th>Регистриран на</th>
                    <th>Статус</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="participant : ${participants}">
                    <td>
                      <strong th:text="${participant.studentFullName}">Ученик</strong>
                      <div th:text="${participant.studentEmail}">student@example.com</div>
                    </td>
                    <td th:text="${participant.registeredAt != null ? T(com.school.ppmg.student_clubs_system_client.controllers.support.EventViewSupport).formatDateTime(participant.registeredAt) : '-'}">2026-04-18 12:00</td>
                    <td>
                      <span
                        class="manage-event-chip"
                        th:classappend="${' manage-event-chip--' + #strings.toLowerCase(participant.status.name())}"
                        th:text="${T(com.school.ppmg.student_clubs_system_client.controllers.support.EventViewSupport).formatLabel(participant.status)}"
                      >
                        Регистриран
                      </span>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <section
              class="event-participants__pagination"
              th:if="${participantPage != null}"
              th:with="currentPage=${participantPage.totalPages > 0 ? participantPage.number + 1 : 1}, totalPages=${participantPage.totalPages > 0 ? participantPage.totalPages : 1}, lastIndex=${participantPage.totalPages > 0 ? participantPage.totalPages - 1 : 0}"
            >
              <a class="events-link events-link--ghost" th:href="${participantPage.first} ? '#' : @{/teacher/events/{id}/participants(id=${event.id},page=0,status=${selectedStatus},q=${q})}" th:classappend="${participantPage.first} ? ' disabled' : ''">Първа</a>
              <a class="events-link events-link--ghost" th:href="${participantPage.first} ? '#' : @{/teacher/events/{id}/participants(id=${event.id},page=${participantPage.number - 1},status=${selectedStatus},q=${q})}" th:classappend="${participantPage.first} ? ' disabled' : ''">Предишна</a>
              <form class="pagination-input" th:action="@{/teacher/events/{id}/participants(id=${event.id})}" method="get" data-page-input>
                <input type="hidden" name="status" th:value="${selectedStatus != null ? selectedStatus.name() : ''}" />
                <input type="hidden" name="q" th:value="${q}" />
                <label class="pagination-input__sr-only" for="teacherEventParticipantsPageNumber">Страница</label>
                <input
                  id="teacherEventParticipantsPageNumber"
                  name="pageDisplay"
                  type="number"
                  min="1"
                  inputmode="numeric"
                  th:attr="max=${totalPages}"
                  th:value="${currentPage}"
                />
                <span class="pagination-input__state">от <strong th:text="${totalPages}">1</strong></span>
              </form>
              <a class="events-link events-link--ghost" th:href="${participantPage.last} ? '#' : @{/teacher/events/{id}/participants(id=${event.id},page=${participantPage.number + 1},status=${selectedStatus},q=${q})}" th:classappend="${participantPage.last} ? ' disabled' : ''">Следваща</a>
              <a class="events-link events-link--ghost" th:href="${participantPage.last} ? '#' : @{/teacher/events/{id}/participants(id=${event.id},page=${lastIndex},status=${selectedStatus},q=${q})}" th:classappend="${participantPage.last} ? ' disabled' : ''">Последна</a>
            </section>
          </div>
        </div>
      </div>
    </th:block>

    <th:block th:fragment="pageScripts">
      <script th:src="@{/js/pagination-input.js}" defer></script>
    </th:block>
  </body>
</html>
