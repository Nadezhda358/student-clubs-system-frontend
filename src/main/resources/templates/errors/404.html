<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Не е намерено | ClubsHub</title>
    <link th:href="@{/assets/logo.png}" rel="icon" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Sora:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/site-chrome.css}" />
    <link rel="stylesheet" th:href="@{/css/club-details.css}" />
  </head>
  <body>
    <header th:replace="fragments/site-chrome :: siteHeader"></header>

    <main class="club-details">
      <div class="container">
        <section class="error-panel">
          <p class="error-code">404</p>
          <h1 class="error-title" th:text="${missingResourceType != null ? 'Заявеният ресурс не е намерен' : 'Клубът не е намерен'}">
            Клубът не е намерен
          </h1>
          <p class="error-text">
            Не успяхме да намерим
            <span th:text="${missingResourceType != null ? 'заявения ресурс' : 'клуб'}">клуб</span>
            с ID
            <span th:text="${missingResourceId != null ? missingResourceId : missingClubId}">0</span>.
          </p>
          <a class="ghost-button" th:href="@{/clubs}">Назад към клубовете</a>
        </section>
      </div>
    </main>

    <footer th:replace="fragments/site-chrome :: siteFooter"></footer>
  </body>
</html>
