<div th:fragment="content">
  <div class="tab-message" th:if="${error}" th:text="${error}">
    Медията все още не е налична.
  </div>

  <div th:if="${error == null}">
    <div class="tab-message" th:if="${media == null or #lists.isEmpty(media)}">
      Все още няма качени изображения.
    </div>
    <ul class="tab-list club-media-grid" th:if="${media != null and !#lists.isEmpty(media)}">
      <li class="club-media-card" th:each="item : ${media}">
        <a
          class="club-media-card__link"
          th:if="${item.url != null and !#strings.isEmpty(item.url)}"
          th:href="${item.url}"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            class="club-media-card__image"
            th:src="${item.url}"
            th:alt="${'Изображение на клуба ' + (item.id != null ? item.id : '')}"
            loading="lazy"
          />
        </a>
        <div
          class="club-media-card__placeholder"
          th:if="${item.url == null or #strings.isEmpty(item.url)}"
        >
          Изображението не е налично
        </div>
      </li>
    </ul>
  </div>
</div>
