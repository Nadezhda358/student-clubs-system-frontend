<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Регистрация на ученик | ClubsHub</title>
    <link th:href="@{/assets/logo.png}" rel="icon" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Sora:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/login.css}" />
  </head>
  <body>
    <main class="login-page">
      <div class="container">
        <section class="login-card">
          <div class="brand">
            <div class="brand-mark">
              <img th:src="@{/assets/logo.png}" alt="Лого на ClubsHub" />
            </div>
            <div class="brand-text">
              <span>ClubsHub</span>
              <span>Ученически живот</span>
            </div>
          </div>

          <h1>Създайте ученически профил</h1>
          <p>Включвайте се в клубове, записвайте се за събития и бъдете част от училищната общност.</p>

          <div class="alert" th:if="${error}" th:text="${error}"></div>

          <form th:action="@{/register}" method="post" th:object="${registerStudentRequest}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <label for="email">Имейл</label>
            <input
              id="email"
              type="email"
              th:field="*{email}"
              autocomplete="email"
              placeholder="you@example.com"
              required
            />

            <label for="password">Парола</label>
            <input
              id="password"
              type="password"
              th:field="*{password}"
              autocomplete="new-password"
              placeholder="Създайте парола"
              required
            />

            <label for="firstName">Име</label>
            <input
              id="firstName"
              type="text"
              th:field="*{firstName}"
              autocomplete="given-name"
              placeholder="Име"
              required
            />

            <label for="lastName">Фамилия</label>
            <input
              id="lastName"
              type="text"
              th:field="*{lastName}"
              autocomplete="family-name"
              placeholder="Фамилия"
              required
            />

            <label for="grade">Клас</label>
            <input
              id="grade"
              type="number"
              th:field="*{grade}"
              min="1"
              max="12"
              step="1"
              placeholder="1 - 12"
              required
            />

            <label for="className">Паралелка</label>
            <input
              id="className"
              type="text"
              th:field="*{className}"
              maxlength="20"
              placeholder="Име или буква на паралелката"
              required
            />

            <button class="cta-button" type="submit">Създай профил</button>
          </form>

          <a class="back-link" th:href="@{/login}">Вече имате профил? Влезте</a>
          <a class="back-link" th:href="@{/clubs}">Назад към клубовете</a>
        </section>
      </div>
    </main>
  </body>
</html>
